<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#182532">
    <title>Change password | MythTV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='library.css') }}">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="auth-brand" href="{{ url_for('auth.change_password') }}" aria-label="MythTV">
        <img src="{{ url_for('static', filename='mythtv.png') }}" alt="MythTV">
      </a>
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>Change password</h1>
      {% if current_user.must_change_password %}
        <p class="auth-description">Set a new password to finish activating the initial administrator account.</p>
      {% else %}
        <p class="auth-description">Update the password for {{ current_user.username }}.</p>
      {% endif %}
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      <form class="auth-form" method="post" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current-password">Current password</label>
        <input id="current-password" name="current_password" type="password" autocomplete="current-password" required autofocus>
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
        <button class="auth-submit" type="submit">Save password</button>
      </form>
    </main>
  </body>
</html>
